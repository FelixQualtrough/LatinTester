<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Cinzel">  <!--For the font-->
    <meta charset="UTF-8">
    <meta id = "" name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Latin Tester</title>
    <link rel="stylesheet" href="CSSRefactor.css">
    <script language = 'JavaScript' src = "AppClassesRevamped.js">
    </script>
    <link rel="icon" href="LaurelLogo2.png">
</head>
<body>
   <!--
    <header>
        <h1>Latin Tester - Eduqas GCSE</h1>
        <h3>By Felix Qualtrough</h3>
    </header>
-->
    <section id="NonHeader">
        <section id="Choosing">
        <div class = "VocabChoice">

            <div class = "VocabChoiceCard" id="AllVocab">
                <label><input type="checkbox" id="AllVocab" onClick = "All(this)">All Vocab</label>
            </div>

            <div class = "OtherVocab">

                <div class="VocabChoiceCard">
                    <label class="all"><input type="checkbox" onClick="toggleGroup(this)" data-group="Nouns" value="all">Nouns (All)</label>
                    <label><input type="checkbox" data-group="Nouns" value="1" id="nouns1">Nouns 1</label>
                    <label><input type="checkbox" data-group="Nouns" value="2" id="nouns2">Nouns 2</label>
                    <label><input type="checkbox" data-group="Nouns" value="3" id="nouns3">Nouns 3</label>
                    <label><input type="checkbox" data-group="Nouns" value="4" id="nouns4">Nouns 4</label>
                    <label><input type="checkbox" data-group="Nouns" value="5" id="nouns5">Nouns 5</label>
                </div>

                <div class="VocabChoiceCard">
                    <label class="all"><input type="checkbox" onClick="toggleGroup(this)" data-group="Verbs" value="all">Verbs (All)</label>
                    <label><input type="checkbox" data-group="Verbs" value="1" id="verbs1">Verbs 1</label>
                    <label><input type="checkbox" data-group="Verbs" value="2" id="verbs2">Verbs 2</label>
                    <label><input type="checkbox" data-group="Verbs" value="3" id="verbs3">Verbs 3</label>
                    <label><input type="checkbox" data-group="Verbs" value="4" id="verbs4">Verbs 4</label>
                    <label><input type="checkbox" data-group="Verbs" value="Irreg" id="IrregVerbs">Irregular Verbs</label>
                    <label><input type="checkbox" data-group="Verbs" value="Dep" id="DepVerbs">Deponent Verbs</label>
                </div>

                <div class="VocabChoiceCard">
                    <label class="all"><input type="checkbox" onClick="toggleGroup(this)" data-group="Adjectives" value="all">Adjectives (All)</label>
                    <label><input type="checkbox" data-group="Adjectives" value="212" id="212Adj">Regular 2-1-2 Adjectives</label>
                    <label><input type="checkbox" data-group="Adjectives" value="33" id="33Adj">Regular 3-3 Adjectives</label>
                    <label><input type="checkbox" data-group="Adjectives" value="IrregComp" id="IrregCompAdj">Irregular Comparative Adjectives</label>
                </div>

                <div class="VocabChoiceCard">
                    <label class="all"><input type="checkbox" onClick="toggleGroup(this)" data-group="Other" value="all">Other (All)</label>
                    <label><input type="checkbox" data-group="Other" value="Adverbs" id="Adverbs">Adverbs</label>
                    <label><input type="checkbox" data-group="Other" value="Pronouns" id="ProNouns">Pronouns</label>
                    <label><input type="checkbox" data-group="Other" value="Prepositions" id="Prepositions">Prepositions</label>
                    <label><input type="checkbox" data-group="Other" value="Conjunctions" id="Conjunctions">Conjunctions</label>
                    <label><input type="checkbox" data-group="Other" value="Miscellaneous" id="Misc">Miscellaneous</label>
                    <label><input type="checkbox" data-group="Other" value="Numerals" id="Nums">Numerals</label>
                </div>

            </div>

        </div>
        

        <div class = "OtherInputs">
            <span>
            <input type="radio" name="EngLat" id = "LE" checked>
            <label for = "LE"><h4>Latin to English</h4></label>
            </span>
            <span>
            <input type="radio" name="EngLat" id = "EL">
            <label for = "EL"><h4>English to Latin</h4></label>
            </span>
            <button onClick = "BeginTest()">Test</button>
        </div>

        </section>

        <section class="TestingPage" id = "TestPage">

            <div id = "Test" class = "Test">

                <div id = "AboveBar">
                    <div id = "Score"></div>
                    <div id = "Progress"></div>
                </div>

                <div id = "ProgressDiv">
                    <!-- Progress bar - I am not entirely sure how it works, got it from internet -->
                    <div class="w3-progress-container w3-round-xlarge">
                        <div class="w3-progressbar w3-round-xlarge"></div>
                    </div>
                </div>

                <h4 id = "Prompt"></h4>

                <input id = "textbox" type="text" placeholder="Enter Answer..." autocomplete="off">

                <!--
                <div id = "Buttons">
                    <button style="display: none;">Reveal</button>
                    <button style="display: none;">Submit</button>
                </div>
                -->

                <!--
                <div id="queryBox">
                    <label for="QueryText">
                    <button id="QueryText"><h3>Disagree with this answer?</h3></button>
                    </label>
                </div>
                -->

                <h3 class ="Info" id = "Info"><br></h3>

            </div>

            <div class ="Incorrect" id = "Incorrect"></div>

        </section>
    </section>
</body>
</html>
